<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz(개선 전) — 납부요청 발송 완료</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <link rel="stylesheet" href="../common/onboarding.css" />
  <!-- Figma: [6.2.2.2.1.3.0]납부관리 발송 완료 (360:159267). Shared by before/ and after/ — keep both copies identical (title only differs). -->
  <style>
    .done { flex: 1; text-align: center; padding: 96px 16px 0; }
    .done img { width: 120px; height: 120px; display: block; margin: 0 auto; }
    .done h1 { margin: 32px 0 0; font: var(--rz-type-headline-bold); color: var(--rz-black); white-space: pre-line; }
    .note { margin: 32px 24px 0; border-radius: 12px; background: #FFF2F2; padding: 16px; font: var(--rz-type-small01-regular); color: var(--rz-red); white-space: pre-line; line-height: 21px; }
    .ok { margin: 32px auto 0; width: 168px; }
  </style>
</head>
<body class="rz">
  <div id="root"></div>
  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=67"></script>
  <script src="../common/data.js?v=7"></script>
  <script src="../common/onboarding.js?v=5"></script>
  <script>
    const R = Rallyz;
    const { $, go } = Onb;
    if (!RzData.get().academy) location.replace("./index.html");
    const body = $("div", "done", [
      $("img", "", [], { src: "../assets/onboarding/done-hands.svg", alt: "" }),
      $("h1", "", ["학생/학부모께\n선택하신 청구서 납부 요청 알림이\n발송되었습니다."]),
      $("p", "note", ["※ 대량 발송 시, 순차적으로 발송되며\n전달되기 까지 최대 3시간 소요될 수 있습니다."]),
      $("div", "ok", [R.Button({ label: "확인", size: 56, onClick: () => go("./payment-manage.html?keep=1") })]),
    ]);
    document.getElementById("root").append(R.Device({ children: [$("div", "screen", [R.StatusBar(), body])] }));
  </script>
</body>
</html>
