<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz(개선 전) — 전체 피드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <link rel="stylesheet" href="../common/onboarding.css" />
  <link rel="stylesheet" href="../common/feed.css?v=2" />
  <!--
    Figma: [7.1.1.2.0.0.0]전체피드 리스트 (360:152570) · 검색결과 없을 때 (360:152541) · 읽은 대상 팝업 (360:152415)
    홈 › 전체 피드 보기 / 하단 내비 피드 탭에서 열린다. 글쓰기 → feed-write.html, 카드 → feed-detail.html. 이미지·파일·조회 대상 선택은 구현하지 않는다(글만).
    클래스가 하나도 없으면 본문에 클래스 논페이지(NonePage.gate needs ["class"], from=feed)를 보여 준다 — 개선 전은 버튼 아래 텍스트 버튼 없음, 개선 후는 있음(NonePage가 버전별로 그림). 클래스 만들기 완료 후: 개선 후 = 피드로 복귀, 개선 전 = 클래스 관리.
    Shared by before/ and after/ — keep both copies identical (title only differs).
  -->
</head>
<body class="rz">
  <div id="root"></div>
  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=65"></script>
  <script src="../common/data.js?v=5"></script>
  <script src="../common/onboarding.js?v=4"></script>
  <script src="../common/none-page.js?v=3"></script>
  <script src="../common/feed.js?v=2"></script>
  <script>
    const R = Rallyz, F = Feed;
    const { $, go } = Onb;
    if (!RzData.get().academy) location.replace("./index.html");
    let q = "";

    const header = R.Header({ kind: "feed", onAction: () => go("./feed-write.html") });
    const nav = R.Navagation({ active: "feed", interactive: false });
    nav.children[0].addEventListener("click", () => go("./home.html")); // 홈 탭만 연결(채팅·일정·더보기는 이 프로토타입에서 다루지 않음)

    const search = R.Search({ placeholder: "피드 내용 검색", onInput: (v) => { q = v.trim(); render(); } });
    const band = $("div", "fd-band", [search]);
    const list = $("div", "");

    function card(f) {
      const reads = $("button", "fd-reads", [$("em", "", [`${F.readCount(f)}명`]), " 읽음"], { type: "button" });
      reads.addEventListener("click", (e) => { e.stopPropagation(); F.openReaders(f); });
      const kids = [
        $("div", "fd-card__ctx", [$("b", "", [F.academy()]), f.klass || ""]),
        $("div", "fd-card__who", [F.profile(32), $("div", "fd-who__txt", [$("p", "fd-who__name", [f.author.name, $("small", "", [f.author.role])]), $("p", "fd-who__date", [F.fmtDate(f.at)])]), reads]),
        $("p", "fd-card__text", [f.content]),
      ];
      if (f.tags?.length) kids.push($("div", "fd-card__tags", f.tags.map((t) => $("span", "", [`# ${t}`]))));
      const smile = $("span", "", [R.Icon("line/16_smile", { size: 16, color: "var(--rz-gray-05)" }), String((f.reactions || []).length)]);
      const cmt = $("span", "", [R.Icon("line/ic24_chat", { size: 16, color: "var(--rz-gray-05)" }), String(F.commentCount(f))]);
      kids.push($("div", "fd-card__foot", [smile, cmt]));
      const a = $("article", "fd-card", kids, { role: "link", tabindex: "0" });
      a.addEventListener("click", () => go(`./feed-detail.html?id=${f.id}`));
      return a;
    }
    function render() {
      band.hidden = !F.all().length; // 작성된 피드가 하나도 없으면 검색 영역을 보여 주지 않는다(개선 전/후 동일)
      const gated = NonePage.gate({ needs: ["class"], from: "feed" }); // 클래스 논페이지 (개선 전/후 유형은 NonePage가 구분)
      if (gated) { list.replaceChildren(gated); return; }
      const feeds = F.all();
      const rows = q ? feeds.filter((f) => f.content.toLowerCase().includes(q.toLowerCase()) || (f.tags || []).some((t) => t.toLowerCase().includes(q.toLowerCase()))) : feeds;
      if (!rows.length) {
        list.replaceChildren(q
          ? $("div", "fd-empty", [$("img", "", [], { src: "../assets/onboarding/class-empty.svg", alt: "" }), $("h2", "", [`‘${q}’의\n검색결과가 없습니다.`]), $("p", "", ["검색어의 철자가 정확한지 확인하거나\n두 단어 이상의 검색어의 경우,\n띄어쓰기를 확인해 보세요."])])
          : $("div", "fd-empty", [$("img", "", [], { src: "../assets/onboarding/feed-empty.svg", alt: "" }), $("h2", "", ["등록된 피드가 없습니다."])])); // 피드 없음 디자인 없음 — 최소 안내
        return;
      }
      list.replaceChildren(...rows.map(card));
    }
    const scroll = $("div", "scroll", [list]);
    const screen = $("div", "screen", [R.StatusBar(), header, nav, band, scroll]);
    document.getElementById("root").append(R.Device({ children: [screen] }));
    render();
  </script>
</body>
</html>
