<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz(개선 전) — 클래스 등록 유도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <link rel="stylesheet" href="../common/onboarding.css" />
  <!-- Figma: 002.03.온보딩/클래스등록유도 (296:125526) -->
</head>
<body class="rz">
  <div id="root"></div>
  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=65"></script>
  <script src="../common/data.js?v=5"></script>
  <script src="../common/onboarding.js?v=4"></script>
  <script>
    const { Device, StatusBar, ButtonGroup } = Rallyz;
    const { $, go } = Onb;

    const body = $("div", "guide");
    body.innerHTML = `
      <img class="guide__hands" src="../assets/onboarding/done-hands.svg" alt="" />
      <h1 class="guide__title">학원 생성이 완료되었습니다.</h1>
      <p class="guide__accent">다음은 클래스를 만들어 보겠습니다.</p>
      <p class="guide__desc">클래스는 학생 관리 및 소통이 이루어지는\n공간으로,랠리즈 서비스 활용을 위한 필수 요소입니다.\n\n클래스 이름과 수업 과목, 수업 시간만 입력해 주시면,\n클래스 간편 등록이 완료됩니다.</p>
      <p class="guide__ask">지금 만들어 볼까요?</p>`;

    const footer = $("div", "footer", [ButtonGroup({
      primary: "클래스 만들기", secondary: "나중에 하기", secondaryColor: "green",
      onPrimary: () => go("./class-create.html"),
      onSecondary: () => go("./home.html"),
    })]);
    const screen = $("div", "screen", [StatusBar(), $("div", "scroll", [body]), footer]);
    document.getElementById("root").append(Device({ children: [screen] }));
  </script>
</body>
</html>
