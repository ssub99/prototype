<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz — 학원 생성 완료</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <link rel="stylesheet" href="../common/onboarding.css" />
  <!-- Figma: [5.3.1.3.0.0.0]온보딩_학원 생성 완료 (286:35464) + _팝업창 (286:35905) -->
</head>
<body class="rz">
  <div id="root"></div>
  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=68"></script>
  <script src="../common/data.js?v=7"></script>
  <script src="../common/onboarding.js?v=5"></script>
  <script>
    const { ButtonGroup } = Rallyz;
    const { $, shell, alert, go } = Onb;
    const A = "../assets/onboarding/";

    const body = $("div", "info");
    body.innerHTML = `
      <img class="info__hands" src="${A}done-hands.svg" alt="" />
      <h1 class="info__title">학원 생성이 완료되었습니다.\n<strong>이제 클래스를 만들어볼까요 ?</strong></h1>
      <p class="info__desc">클래스는 학생 관리 및 소통이 이루어지는\n공간으로, 랠리즈 기능을 위한 필수 요소입니다.</p>

      <img class="info__art" style="height:224px" src="${A}academy-obj-01.svg" alt="" />
      <h2 class="info__heading">랠리즈의 클래스란 ?</h2>
      <p class="info__desc">학원의 커리큘럼 및 연령별로 운영되는 반을\n랠리즈에 동일하게 구성할 수 있는 공간이에요!</p>

      <img class="info__art" style="height:210px" src="${A}academy-obj-02.svg" alt="" />
      <h2 class="info__heading">생성된 클래스는 학원관리에서\n확인하실 수 있어요</h2>
      <p class="info__desc">여러개의 클래스를 만들 수 있고\n다양한 정보를 넣을 수 있어요.</p>

      <img class="info__art" style="height:196px" src="${A}academy-obj-03.svg" alt="" />
      <h2 class="info__heading">기간클래스 또는\n회차클래스 운영이 가능해요</h2>
      <p class="info__desc">클래스 특성에 맞게 기간반 또는\n회차반을 제한없이 랠리즈로 관리 해보세요!</p>`;

    const later = () => alert(footer, {
      message: "나중에 진행하시겠어요 ?\n지금 생성하면 바로 모든 기능 이용이 가능합니다.\n(학원관리 화면에서도 생성 하실 수 있습니다.)",
      cancelLabel: "아니오", confirmLabel: "예",
      onConfirm: () => go("./home.html"),
    });
    const footer = $("div", "footer", [ButtonGroup({ primary: "클래스 만들기", secondary: "나중에 하기", secondaryColor: "grey", onPrimary: () => go("./class-create.html"), onSecondary: later })]);

    shell({ title: "학원 생성", step: "1/3", lead: null, body: [body], footer });
  </script>
</body>
</html>
