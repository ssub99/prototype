<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz — 무소속 홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <style>
    body {
      margin: 0;
      -webkit-font-smoothing: antialiased; /* home.html(body.rz)과 같은 글자 렌더링 — 없으면 검정 박스 글자가 살짝 두꺼워 보인다 */
      box-sizing: border-box; /* home.html(body.rz)과 같게 — 없으면 min-height:100vh + 위아래 패딩 80px 때문에 페이지 스크롤이 생긴다 */
      min-height: 100vh;
      font-family: var(--rz-font-sans);
      color: var(--rz-color-ink);
      background:
        radial-gradient(1200px 700px at 50% -10%, color-mix(in srgb, var(--rz-color-blue-g) 80%, transparent) 0%, transparent 55%),
        radial-gradient(900px 500px at 80% 110%, color-mix(in srgb, var(--rz-color-green-g) 90%, transparent) 0%, transparent 50%),
        linear-gradient(165deg, var(--rz-color-gray-01), var(--rz-color-gray-02));
      display: grid;
      place-items: center;
      padding: 40px var(--rz-space-16);
    }

    .scroll {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }
    .screen { display: flex; flex-direction: column; height: 100%; }
    .screen > .scroll { flex: 1; min-height: 0; }

    .app {
      position: relative;
      width: var(--rz-size-screen-width);
      /* 화면 높이(812 − 상태바·헤더)에 한 번에 들어가도록 높이를 고정하지 않고 여백을 줄였다 → 스크롤 없음 */
      background: var(--rz-color-canvas);
    }

    .pad { padding: var(--rz-space-16) var(--rz-space-inset) 0; }

    .banner {
      margin-top: var(--rz-space-16);
      height: 130px;
      background: var(--rz-color-banner);
      position: relative;
      overflow: hidden;
    }
    .banner-copy { position: absolute; left: var(--rz-space-inset); top: 32px; z-index: 1; }
    .banner-title {
      margin: 0;
      font-size: var(--rz-type-headline-bold-size);
      line-height: var(--rz-type-headline-bold-line);
      font-weight: var(--rz-type-headline-bold-weight);
    }
    .banner-title .name { color: var(--rz-color-emphasis-name); }
    .banner-sub {
      margin: var(--rz-space-4) 0 0;
      font-size: var(--rz-type-body02-regular-size);
      line-height: var(--rz-type-body02-regular-line);
      font-weight: var(--rz-type-body02-regular-weight);
      color: var(--rz-color-gray-06);
    }
    .banner-art {
      position: absolute;
      right: var(--rz-space-inset);
      top: 30px;
      width: 143px;
      height: 100px;
      object-fit: contain;
      object-position: right bottom;
      pointer-events: none;
    }

    .alarm-band { background: #F7F9FA; padding-top: 12px; padding-bottom: 12px; } /* 탑 네비 아래 알림 박스 영역: 옅은 회색 띠 + 흰 알림 카드 */
    .inquiry {
      width: var(--rz-size-content-width);
      height: 64px;
      border-radius: var(--rz-radius-alarm);
      background: var(--rz-color-gray-01);
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      column-gap: var(--rz-space-8);
      padding: 0 var(--rz-space-16);
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
    }
    .inquiry .label {
      font-size: var(--rz-type-small01-bold-size);
      font-weight: var(--rz-type-small01-bold-weight);
      line-height: var(--rz-type-small01-bold-line);
      color: var(--rz-color-gray-06);
    }
    .inquiry .desc {
      font-size: var(--rz-type-small01-regular-size);
      line-height: var(--rz-type-small01-regular-line);
      font-weight: var(--rz-type-small01-regular-weight);
      color: var(--rz-color-gray-05);
    }
    .inquiry .badge {
      font-size: var(--rz-type-small01-bold-size);
      font-weight: var(--rz-type-small01-bold-weight);
      color: var(--rz-color-gray-05);
      white-space: nowrap;
    }
    .chevron {
      width: 24px;
      height: 24px;
      color: var(--rz-color-gray-04);
    }

    .section-label {
      margin: var(--rz-space-16) var(--rz-space-inset) 0;
      font-size: var(--rz-type-body02-regular-size);
      line-height: var(--rz-type-body02-regular-line);
      font-weight: var(--rz-type-body02-regular-weight);
      color: var(--rz-color-gray-06);
    }

    .role-list {
      margin-top: var(--rz-space-16);
      padding: 0 var(--rz-space-inset);
      display: flex;
      flex-direction: column;
      gap: var(--rz-space-16);
    }
    .role-row {
      display: flex;
      align-items: center;
      gap: var(--rz-space-8);
      width: var(--rz-size-content-width);
      min-height: 50px;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      padding: 0;
    }
    .role-row img { width: 50px; height: 50px; flex: 0 0 50px; }
    .role-text { flex: 1; min-width: 0; }
    .role-text strong {
      display: block;
      font-size: var(--rz-type-body02-bold-size);
      line-height: var(--rz-type-body02-bold-line);
      font-weight: var(--rz-type-body02-bold-weight);
    }
    .role-text span {
      display: block;
      margin-top: var(--rz-space-2);
      font-size: var(--rz-type-small01-regular-size);
      line-height: var(--rz-type-small01-regular-line);
      font-weight: var(--rz-type-small01-regular-weight);
      color: var(--rz-color-gray-06);
    }

    .divider {
      margin: var(--rz-space-16) var(--rz-space-inset) 0;
      border: 0;
      height: 1px;
      background: var(--rz-color-gray-02);
    }

    .find-row { margin-top: var(--rz-space-12); padding: 0 var(--rz-space-inset); }

    .fab {
      position: absolute;
      right: var(--rz-space-inset);
      bottom: var(--rz-space-24);
      width: 56px;
      height: 56px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--rz-color-primary) 35%, transparent));
      z-index: 5;
    }
    .fab img { width: 56px; height: 56px; display: block; }

    .ds-link {
      position: fixed;
      top: var(--rz-space-16);
      right: var(--rz-space-16);
      font-size: var(--rz-type-small01-regular-size);
      color: var(--rz-color-gray-06);
      text-decoration: none;
      background: color-mix(in srgb, var(--rz-color-canvas) 85%, transparent);
      padding: var(--rz-space-8) var(--rz-space-12);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <a class="ds-link" href="../ds/showcase.html">Tokens & Components</a>
  <div id="root"></div>

  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=68"></script>
  <script src="../common/data.js?v=7"></script>
  <script>
    const { Device, StatusBar, Header, Alarm } = window.Rallyz;

    const chevron = `
      <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const app = document.createElement("main");
    app.className = "app";

    // status bar + header stay fixed above the scroll area
    const fixedTop = [StatusBar(), Header({ kind: "home", title: "홈", logoSrc: "../assets/logo.png" })];

    const alarmWrap = document.createElement("div");
    alarmWrap.className = "pad alarm-band"; // Figma 001.00.무소속/홈 — 알림 영역(Rectangle 3 #F7F9FA)
    alarmWrap.append(Alarm({ iconSrc: "../assets/alarm-icon.png" }));
    app.append(alarmWrap);

    const banner = document.createElement("section");
    banner.className = "banner";
    banner.setAttribute("aria-label", "환영 배너");
    banner.innerHTML = `
      <div class="banner-copy">
        <h1 class="banner-title rz-type-headline-bold">환영합니다! <span class="name">김랠리님</span></h1>
        <p class="banner-sub">새로운 학원생활을 시작해볼까요?</p>
      </div>
      <img class="banner-art" src="../assets/illustration.png" alt="" />
    `;
    app.append(banner);

    const inquiryPad = document.createElement("div");
    inquiryPad.className = "pad";
    inquiryPad.innerHTML = `
      <a class="inquiry" aria-label="학원 문의내역 1건 답변대기">
        <div>
          <div class="label">학원 문의내역</div>
          <div class="desc">접수하신 내역을 확인하실 수 있습니다.</div>
        </div>
        <span class="badge">1건 답변대기</span>
        ${chevron}
      </a>
    `;
    app.append(inquiryPad);

    const label1 = document.createElement("p");
    label1.className = "section-label";
    label1.textContent = "학원에 소속되어 있다면?";
    app.append(label1);

    const roles = [
      ["../assets/icon_학원장직원.png", "학원장, 직원", "학원을 운영/관리하고 있어요."],
      ["../assets/icon_학원선생님.png", "학원 선생님", "학원에서 수업을 하고 있어요."],
      ["../assets/icon_학생학부모.png", "학생과 학부모", "학원 수업을 수강하거나, 학생의 보호자예요."],
    ];
    const roleList = document.createElement("div");
    roleList.className = "role-list";
    const roleLinks = { "학원장, 직원": "./onboarding-intro.html" };
    for (const [src, title, desc] of roles) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "role-row";
      if (roleLinks[title]) row.addEventListener("click", () => (location.href = roleLinks[title]));
      row.innerHTML = `
        <img src="${src}" alt="" />
        <div class="role-text"><strong>${title}</strong><span>${desc}</span></div>
        ${chevron}
      `;
      roleList.append(row);
    }
    app.append(roleList);

    app.insertAdjacentHTML("beforeend", `<hr class="divider" />`);
    const label2 = document.createElement("p");
    label2.className = "section-label";
    label2.textContent = "학원에 소속되지 않았다면?";
    app.append(label2);

    const find = document.createElement("div");
    find.className = "find-row";
    find.innerHTML = `
      <button type="button" class="role-row">
        <img src="../assets/icon_학원찾기.png" alt="" />
        <div class="role-text">
          <strong>관심 학원 찾아보기</strong>
          <span>관심 지역, 과목, 키워드로 내게 맞는 학원을 찾아요.</span>
        </div>
      </button>
    `;
    app.append(find);

    const scroll = document.createElement("div");
    scroll.className = "scroll";
    scroll.append(app);

    const screen = document.createElement("div");
    screen.className = "screen";
    screen.append(...fixedTop, scroll);

    const device = Device({ children: [screen] });
    const fab = document.createElement("button");
    fab.type = "button";
    fab.className = "fab";
    fab.setAttribute("aria-label", "문의하기");
    fab.innerHTML = `<img src="../assets/fab.png" alt="" />`;
    device.querySelector(".rz-device__screen").append(fab);

    document.getElementById("root").append(device);
  </script>
</body>
</html>
