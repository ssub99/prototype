<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rallyz — 클래스 생성 완료</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../ds/tokens.css" />
  <link rel="stylesheet" href="../ds/components.css" />
  <link rel="stylesheet" href="../common/onboarding.css" />
  <!-- Figma: [5.3.2.2.0.0.0]온보딩_클래스 생성 완료 (286:37081) -->
</head>
<body class="rz">
  <div id="root"></div>
  <script src="../ds/rallyz.browser.js"></script>
  <script src="../common/home-chip.js?v=67"></script>
  <script src="../common/data.js?v=7"></script>
  <script src="../common/onboarding.js?v=5"></script>
  <script>
    const { ButtonGroup } = Rallyz;
    const { $, shell, go } = Onb;
    const A = "../assets/onboarding/";

    const body = $("div", "info");
    body.innerHTML = `
      <img class="info__hands" src="${A}done-hands.svg" alt="" />
      <h1 class="info__title">클래스 생성이 완료되었습니다.\n<strong>마지막으로\n학생을 등록하고 시작해보세요!</strong></h1>
      <p class="info__desc">출석, 간편결제, 공지사항 등 랠리즈의\n간편한 기능을 활용할 학생등록이 필요합니다.</p>

      <img class="info__art" style="height:200px" src="${A}class-obj-04.svg" alt="" />
      <h2 class="info__heading">학생관리는 일괄적으로\n조회/관리 할 수 있어요</h2>
      <p class="info__desc">등록된 학생들의 기본 정보 조회가 가능하며\n보호자와도 바로 연결됩니다.</p>

      <img class="info__art" style="height:192px" src="${A}class-obj-05.svg" alt="" />
      <h2 class="info__heading">학생등록 시\n초대메세지를 발송할 수 있어요</h2>
      <p class="info__desc">등록을 완료하면 해당 학생 및 보호자에게\n학원관리에서 초대메세지를 발송하실 수 있습니다.</p>

      <img class="info__art" style="height:142px" src="${A}class-obj-06.svg" alt="" />
      <h2 class="info__heading">등록된 정보는\n보안지침에 따라 안전하게 보관되요</h2>
      <p class="info__desc">등록된 정보는 생성된 학원에서만\n조회/변경이 가능합니다.</p>`;

    const footer = $("div", "footer", [ButtonGroup({
      primary: "학생 등록하기", secondary: "나중에 하기", secondaryColor: "grey",
      onPrimary: () => go("./student-register.html"),
      onSecondary: () => go("./home.html"),
    })]);

    shell({ title: "클래스 생성", step: "2/3", lead: null, body: [body], footer });
  </script>
</body>
</html>
